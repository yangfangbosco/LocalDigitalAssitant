plugins {
    id 'com.android.application'
}

android {
    namespace 'com.digitalhuman.kiosk'
    compileSdk 34

    defaultConfig {
        applicationId "com.digitalhuman.kiosk"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    signingConfigs {
        release {
            storeFile file('/tmp/kiosk.keystore')
            storePassword 'android'
            keyAlias 'kiosk'
            keyPassword 'android'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt')
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
}
